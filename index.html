<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101713"><title>Desafío Gym</title><style>*{box-sizing:border-box}body{margin:0;background:#101713;color:#f7faf7;font-family:system-ui,-apple-system,Arial,sans-serif}main{max-width:560px;margin:auto;min-height:100vh;padding:28px 22px}header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 28px}.logo{color:#a3e635;font-size:30px;font-weight:900;letter-spacing:1px}.sub{font-size:11px;letter-spacing:2px}.hero{background:linear-gradient(140deg,#28392a,#111a13);border:1px solid #455b41;border-radius:22px;padding:32px 24px;margin-bottom:20px}h1{font-size:31px;line-height:1.15;margin:0 0 16px}p{color:#d4ded4;line-height:1.6}.tag{color:#a3e635;font-size:12px;letter-spacing:2px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{border:1px solid #3b4c3c;background:#222e25;border-radius:16px;padding:20px 14px;text-align:left;color:white;font-size:16px;font-weight:700;min-height:100px;cursor:pointer}.tile span{display:block;color:#a3e635;font-size:25px;margin-bottom:10px}.notice{margin-top:25px;font-size:13px;color:#b5c1b7}.back{background:none;border:0;color:#a3e635;font-size:16px;padding:12px 0;cursor:pointer}.panel{background:#222e25;border-radius:18px;padding:22px;margin-top:18px}a{color:#a3e635}</style></head><body><main><header><div><div class="logo">DESAFÍO</div><div class="sub">GYM · TU MEJOR VERSIÓN</div></div><div style="font-size:34px">💪</div></header><div id="view"><section class="hero"><div class="tag">BIENVENIDOS</div><h1>Tu mejor versión comienza aquí.</h1><p>Una hora en Desafío Gym mejorará tus otras 23 horas.</p></section><div class="grid"><button class="tile" onclick="show('membresia')"><span>▣</span>Mi membresía</button><button class="tile" onclick="show('clases')"><span>◷</span>Clases</button><button class="tile" onclick="show('pagos')"><span>＄</span>Reportar pago</button><button class="tile" onclick="show('regalos')"><span>🎁</span>Gift Cards</button></div><p class="notice">Versión inicial de prueba. No se procesan pagos ni se almacenan datos personales.</p></div></main><script>const home=document.getElementById('view').innerHTML;const pages={membresia:['Mi membresía','Plan de musculación: $40 al mes. Próximamente podrás consultar tu fecha de vencimiento.'],clases:['Clases','Próximamente podrás consultar horarios y solicitar reservas para Jumping, Xtreme Bike, CrossFit y otras actividades.'],pagos:['Reportar pago','Próximamente podrás enviar la referencia de tu pago para que recepción lo verifique. No introduzcas datos bancarios todavía.'],regalos:['Gift Cards','Próximamente podrás solicitar Gift Cards de Desafío Gym.']};function show(k){const [t,d]=pages[k];document.getElementById('view').innerHTML='<button class="back" onclick="goHome()">← Volver al inicio</button><section class="panel"><div class="tag">DESAFÍO GYM</div><h1>'+t+'</h1><p>'+d+'</p></section>'}function goHome(){document.getElementById('view').innerHTML=home}</script></body></html>
